[project]
name = "gig-rights"
version = "0.1.0"
description = "Statutory holiday entitlement & audit engine for irregular and gig workers"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "sqlalchemy>=2.0.0",
    "python-dateutil>=2.9.0",
    "pandas>=2.2.0",
    "typer>=0.12.0",
    "reportlab>=4.1.0",
    "pytest-cov>=7.1.0",
    "pytest>=9.1.1",
    "hypothesis>=6.161.0",
    "loguru>=0.7.3",
    "ruff>=0.16.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.27.0",
]

[project.scripts]
gig-rights = "gig_rights.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gig_rights"]
