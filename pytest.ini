[pytest]
minversion = 8.0

addopts = 
    -ra 
    --tb=short 
    --strict-markers
    --cov=gig_rights
    --cov-report=term-missing

testpaths = tests

python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

markers =
    unit: Fast unit tests for individual calculators and logic
    hypothesis: Property-based invariant tests using Hypothesis
    slow: Tests that take longer to execute

filterwarnings =
    ignore::Warning:starlette.*
    ignore::Warning:fastapi.*
    ignore:.*httpx.*:DeprecationWarning